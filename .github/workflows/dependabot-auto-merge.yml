name: Dependabot Auto-merge

# dependabot 的「分组」PR (npm-minor / actions-minor) 按其配置只含 minor/patch
# 级更新, CI 全绿后无需人工过目 —— 这里自动以 merge commit 方式合并。
# 大版本升级 (typescript 7 / react-table 9 这类) 不在分组里, 永远留给人工决策。
#
# CI 已按区域拆成多个 workflow (Backend/Admin/Miniprogram/Compose)。本工作流
# 只监听 CI Admin 一个入口 (npm 分组 PR 只触发它; actions 分组 PR 改 workflow
# 文件时它也会跑), 合并正确性不依赖触发源 —— 步骤里会用 API 校验该提交的
# 「全部」check runs 都已成功。这样避免每个 CI workflow 完成都生成一条
# (多数为 skipped 的) run 记录刷屏 Actions 页面 (workflow_run 即使 job
# 跳过也会创建 run)。
on:
  workflow_run:
    workflows: [CI Admin]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: 合并全绿的 dependabot 分组 PR
    # 仅当: 触发的 CI 成功 + 是 dependabot 分支
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 查找并合并符合条件的 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PRS=$(gh pr list --repo "$GH_REPO" --head "$HEAD_BRANCH" --state open \
            --json number,title,headRefOid)
          MATCH=$(echo "$PRS" | python3 -c "
          import json, sys
          for pr in json.load(sys.stdin):
              # 只自动合并「分组」PR: 标题带 group 的一定是 minor/patch 批量更新
              if pr['headRefOid'] == '$HEAD_SHA' and 'group' in pr['title'].lower():
                  print(pr['number'])
                  break
          ")
          if [ -z "$MATCH" ]; then
            echo "无符合条件的分组 PR (大版本/非分组 PR 留给人工)"
            exit 0
          fi
          # 校验该提交的全部 check runs 均已完成且非失败 (skipped/成功都算过)
          PENDING=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs" \
            --jq '[.check_runs[] | select(.status != "completed" or .conclusion == "failure")] | length')
          if [ "$PENDING" != "0" ]; then
            echo "尚有未完成/失败的检查 ($PENDING 项), 本次不合并"
            exit 0
          fi
          echo "全部检查通过, 自动合并 PR #$MATCH"
          gh pr merge "$MATCH" --repo "$GH_REPO" --merge
