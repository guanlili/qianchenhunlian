name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 03:00 (UTC) 跑一次 e2e（admin-e2e job），防止 Playwright 用例静默腐烂
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check app

      - name: Ruff format check
        run: uv run ruff format app --check

      - name: Mypy
        run: uv run mypy app

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run coverage run -m pytest tests/ -v
        env:
          # SQLite in-memory，无需真实数据库
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          FIRST_SUPERUSER: "admin@example.com"
          FIRST_SUPERUSER_PASSWORD: "ci-test-password"
          PROJECT_NAME: "qianchenhunlian-ci"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "postgres"
          UPLOAD_DIR: "/tmp/ci-uploads"

      - name: Coverage report
        run: uv run coverage report

  backend-test-pg:
    # 生产是 PostgreSQL，SQLite 单测跑不了 PG 特有行为（_shandong_clause 正则、
    # DELETE...USING 等）。本 job 用真实 PG 跑同一套 pytest（conftest 按
    # TEST_DATABASE_URL 切换引擎），并附 alembic 迁移链与 models 的 schema 一致性守门。
    name: Backend — Tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests (PostgreSQL)
        run: uv run coverage run -m pytest tests/ -v
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/test"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          FIRST_SUPERUSER: "admin@example.com"
          FIRST_SUPERUSER_PASSWORD: "ci-test-password"
          PROJECT_NAME: "qianchenhunlian-ci"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "postgres"
          UPLOAD_DIR: "/tmp/ci-uploads"

  admin-build:
    name: Admin — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome lint
        run: ./node_modules/.bin/biome check --no-errors-on-unmatched --files-ignore-unknown=true ./

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  admin-test:
    name: Admin Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test

  miniprogram-lint:
    name: Miniprogram Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS 语法检查 (全量，含顶层测试)
        run: find miniprogram tests -name "*.js" -not -path "*/miniprogram_npm/*" -exec node --check {} \;

  miniprogram-journey:
    # 小程序唯一的全链路回归（登录→资料→会员→兑换→匹配），纯 Node 可跑零依赖
    name: Miniprogram Journey Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 运行用户旅程模拟测试
        run: node tests/miniprogram/journey_test.js

  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: 校验 compose 配置
        run: docker compose config -q
      - name: 构建 backend
        run: docker compose build backend
      - name: 启动 db + backend (等健康)
        run: docker compose up -d --wait backend
      - name: 健康检查
        run: curl -f http://localhost:8000/api/v1/utils/health-check/
      - name: 清理
        if: always()
        run: docker compose down -v --remove-orphans

  admin-e2e:
    # Playwright e2e（登录/找回密码/用户设置是后台最高危路径）。
    # 不阻塞 PR（spec 依赖完整环境，且历史上无 CI 保护可能已漂移），
    # 每周定时 + 手动触发跑一次，腐烂在这里显式暴露而不是假装存在。
    name: Admin E2E (Playwright)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - name: 准备 .env（含 e2e 需要的 SMTP 指向 mailcatcher）
        working-directory: .
        run: |
          cp .env.example .env
          sed -i 's|^SMTP_HOST=.*|SMTP_HOST=mailcatcher-e2e|' .env
          sed -i 's|^SMTP_PORT=.*|SMTP_PORT=1025|' .env
          sed -i 's|^SMTP_TLS=.*|SMTP_TLS=False|' .env
          # 并行 e2e 用例集中登录/找回密码, 放开 IP 限流阈值
          printf 'LOGIN_IP_MAX=500\nSENSITIVE_MAX=500\n' >> .env

      - name: 启动 db + backend (等健康)
        working-directory: .
        run: docker compose up -d --wait backend

      - name: 启动 mailcatcher（接入 compose 网络，供 backend 发信与用例读信）
        working-directory: .
        run: |
          docker run -d --name mailcatcher-e2e \
            --network "$(docker compose ps -q backend | xargs docker inspect -f '{{range .NetworkSettings.Networks}}{{.NetworkID}}{{end}}')" \
            --network-alias mailcatcher-e2e \
            -p 1080:1080 schickling/mailcatcher

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run e2e
        env:
          MAILCATCHER_HOST: "http://localhost:1080"

      - name: 清理
        if: always()
        working-directory: .
        run: |
          docker rm -f mailcatcher-e2e || true
          docker compose down -v --remove-orphans
