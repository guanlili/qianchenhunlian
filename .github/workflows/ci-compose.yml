name: CI Compose

# 区域化 workflow: 仅容器/编排配置变化时才跑 compose 冒烟
# (Dockerfile、compose 文件、部署脚本、依赖锁文件)。普通业务代码 PR
# 不再构建 docker 镜像 —— 单测已覆盖, 冒烟只为验证容器化路径本身。
on:
  # 不设 push 触发: PR 事件已跑同样检查, main 合并后重复跑纯烧分钟
  # (风险由合并前 update branch 兜底; 详见 docs/07)
  pull_request:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'backend/scripts/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'docker-compose*.yml'
      - 'deploy.sh'
      - '.github/workflows/**'

concurrency:
  group: ci-compose-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: 校验 compose 配置
        run: docker compose config -q
      - name: 构建 backend
        run: docker compose build backend
      - name: 启动 db + backend (等健康)
        run: docker compose up -d --wait backend
      - name: 健康检查
        run: curl -f http://localhost:8000/api/v1/utils/health-check/
      - name: 清理
        if: always()
        run: docker compose down -v --remove-orphans
