name: CI

# 分钟数优化 (免费额度 2000 分钟/月, 按所有 job 时长累加计费):
# 1. push 只留 main (合并后验证 + 直推拦截) —— 功能分支 push 不再触发,
#    由 PR 事件覆盖, 消灭「分支 push + PR」双跑 (原先每次 PR 更新跑两遍全套)
# 2. 同一 PR 的新推送自动取消未跑完的旧 run (快速迭代不再白烧)
# 3. 路径过滤: 只跑受影响区域的 job (改文档 ≈ 只花检测的几十秒;
#    仅小程序的 PR 跳过后端两套测试; dependabot 的 admin PR 同理)
# 4. 每周 schedule 只为 e2e 而设, 其余 job 在 schedule 事件下全部跳过
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 03:00 (UTC) 跑一次 e2e（admin-e2e job），防止 Playwright 用例静默腐烂
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main 的 run 不取消 (合并后验证); PR/分支的新推送取消旧 run
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') }}

# 最小权限: 变更检测 (dorny/paths-filter) 需要读 PR 文件列表
permissions:
  contents: read
  pull-requests: read

jobs:
  guard-main:
    # 免费版私有仓库开不了分支保护，用「CI 标红 + deploy 仅由 PR 合并触发」做门禁:
    # main 只接受 PR 的 merge commit 合并 (提交信息以 "Merge pull request #" 开头),
    # 其余一律视为直推 → 本 job 失败 → main 的 CI 标红, 且 deploy.yml 不会部署该提交。
    # 因此 PR 必须用 "Create a merge commit" 方式合并, 禁 rebase/squash (它们产生的
    # 提交无合并标记, 会被误拦); 功能分支 push 放行; PR 事件本 job 跳过。
    name: Main 直推拦截
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 校验 main 提交来自 PR 合并
        if: github.ref == 'refs/heads/main'
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$HEAD_MSG" == "Merge pull request #"* ]]; then
            echo "来自 PR 合并, 放行"
            exit 0
          fi
          echo "::error::main 只接受 PR 合并 (merge commit)。请走 分支 → PR → CI 绿 → merge commit 合并 的发布流程; 本次直推不会被部署。"
          exit 1
      - name: 非目标分支, 放行
        if: github.ref != 'refs/heads/main'
        run: echo "功能分支 push, 放行"

  changes:
    name: 变更检测
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      miniprogram: ${{ steps.filter.outputs.miniprogram }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # infra = 构建/部署骨架变化, 视为「全区域受影响」, 所有 job 都跑
          filters: |
            backend:
              - 'backend/**'
            admin:
              - 'admin/**'
            miniprogram:
              - 'miniprogram/**'
              - 'tests/**'
            infra:
              - 'docker-compose*.yml'
              - '.github/workflows/**'
              - 'deploy.sh'

  backend-lint:
    name: Backend — Lint & Type Check
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check app

      - name: Ruff format check
        run: uv run ruff format app --check

      - name: Mypy
        run: uv run mypy app

  backend-test:
    name: Backend — Tests
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --dev

      # SQLite 套件并行跑 (243 例约 25s, 串行要 2 分钟+); 覆盖率门槛读 pyproject
      - name: Run tests
        run: uv run pytest -n auto --cov=app --cov-report=term-missing --cov-context=test
        env:
          # SQLite in-memory，无需真实数据库
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          FIRST_SUPERUSER: "admin@example.com"
          FIRST_SUPERUSER_PASSWORD: "ci-test-password"
          PROJECT_NAME: "qianchenhunlian-ci"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "postgres"
          UPLOAD_DIR: "/tmp/ci-uploads"

  backend-test-pg:
    # 生产是 PostgreSQL，SQLite 单测跑不了 PG 特有行为（_shandong_clause 正则、
    # DELETE...USING 等）。本 job 用真实 PG 跑同一套 pytest（conftest 按
    # TEST_DATABASE_URL 切换引擎），并附 alembic 迁移链与 models 的 schema 一致性守门。
    # 串行跑: 共享同一 PG 库 + 每测试 savepoint 回滚, 并行会互相踩
    name: Backend — Tests (PostgreSQL)
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests (PostgreSQL)
        run: uv run pytest --cov=app --cov-report=term-missing
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/test"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          FIRST_SUPERUSER: "admin@example.com"
          FIRST_SUPERUSER_PASSWORD: "ci-test-password"
          PROJECT_NAME: "qianchenhunlian-ci"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "postgres"
          UPLOAD_DIR: "/tmp/ci-uploads"

  admin-checks:
    # 原 Lint & Build 与 Unit Tests 两个 job 合一 (省一次 npm ci + node setup)
    name: Admin — Lint, Test & Build
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.admin == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome lint
        run: ./node_modules/.bin/biome check --no-errors-on-unmatched --files-ignore-unknown=true ./

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  miniprogram-lint:
    name: Miniprogram Lint
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.miniprogram == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS 语法检查 (全量，含顶层测试)
        run: find miniprogram tests -name "*.js" -not -path "*/miniprogram_npm/*" -exec node --check {} \;

  miniprogram-journey:
    # 小程序唯一的全链路回归（登录→资料→会员→兑换→匹配），纯 Node 可跑零依赖
    name: Miniprogram Journey Test
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.miniprogram == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 运行用户旅程模拟测试
        run: node tests/miniprogram/journey_test.js

  compose-smoke:
    name: Compose Smoke
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: 校验 compose 配置
        run: docker compose config -q
      - name: 构建 backend
        run: docker compose build backend
      - name: 启动 db + backend (等健康)
        run: docker compose up -d --wait backend
      - name: 健康检查
        run: curl -f http://localhost:8000/api/v1/utils/health-check/
      - name: 清理
        if: always()
        run: docker compose down -v --remove-orphans

  admin-e2e:
    # Playwright e2e（登录/找回密码/用户设置是后台最高危路径）。
    # 不阻塞 PR（spec 依赖完整环境，且历史上无 CI 保护可能已漂移），
    # 每周定时 + 手动触发跑一次，腐烂在这里显式暴露而不是假装存在。
    name: Admin E2E (Playwright)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: 准备 .env（含 e2e 需要的 SMTP 指向 mailcatcher）
        working-directory: .
        run: |
          cp .env.example .env
          sed -i 's|^SMTP_HOST=.*|SMTP_HOST=mailcatcher-e2e|' .env
          sed -i 's|^SMTP_PORT=.*|SMTP_PORT=1025|' .env
          sed -i 's|^SMTP_TLS=.*|SMTP_TLS=False|' .env
          # 并行 e2e 用例集中登录/找回密码, 放开 IP 限流阈值
          printf 'LOGIN_IP_MAX=500\nSENSITIVE_MAX=500\n' >> .env

      - name: 启动 db + backend (等健康)
        working-directory: .
        run: docker compose up -d --wait backend

      - name: 启动 mailcatcher（接入 compose 网络，供 backend 发信与用例读信）
        working-directory: .
        run: |
          docker run -d --name mailcatcher-e2e \
            --network "$(docker compose ps -q backend | xargs docker inspect -f '{{range .NetworkSettings.Networks}}{{.NetworkID}}{{end}}')" \
            --network-alias mailcatcher-e2e \
            -p 1080:1080 schickling/mailcatcher

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run e2e
        env:
          MAILCATCHER_HOST: "http://localhost:1080"

      - name: 清理
        if: always()
        working-directory: .
        run: |
          docker rm -f mailcatcher-e2e || true
          docker compose down -v --remove-orphans
