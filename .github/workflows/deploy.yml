name: Deploy

# 合并 PR 到 main → 自动部署到生产服务器。
# 服务器在大陆、连不上 GitHub，所以用 rsync 把代码推过去、服务器本地构建（不用 git pull）。
#
# 触发方式即发布门禁（免费版私有仓库开不了分支保护）:
# - 只有「PR 合并」和手动触发会部署; 直接 push main 不会触发本工作流,
#   且该直推会让 CI 的「Main 直推拦截」job 标红。
# - 升级 GitHub Pro 后建议再开真正的分支保护（命令见 docs/07-协作规范.md）。
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# 部署串行、不可中断（避免两个部署并发）
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # PR 被关闭但未合并（如手动关闭/被拒）不部署
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to server (rsync; 排除 .env/data/node_modules)
        # 服务器全程不碰 GitHub：代码由 Actions 推过去。
        # --delete 清理服务器上仓库里已删的文件；被 --exclude 的 .env/data 等受保护不会被删。
        # ssh 统一带保活参数: 服务器本地构建阶段可能长时间无输出 (如 uv sync 慢源),
        # 无保活时中间网络设备会掐掉空闲连接 (曾真实发生: Broken pipe exit 255)
        run: |
          RSYNC_SSH_OPTS="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'admin/node_modules/' \
            --exclude 'admin/dist/' \
            --exclude 'logs/' \
            --exclude '*.bak*' \
            -e "$RSYNC_SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Build & start on server
        # deploy.sh build 会重建镜像、启动，并等待 backend 健康就绪（不健康则退出非 0，部署标红）
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && ./deploy.sh build"
