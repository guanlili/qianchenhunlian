name: PR Review (Multi-LLM Consensus)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 同一 PR 短时间内多次 push 只跑最后一次，节省 minutes
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Multi-LLM Review
    # draft PR 不审
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # 需要写权限来 post review comment
    timeout-minutes: 8

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/pr-review/requirements.txt

      - name: Install dependencies
        run: |
          pip install --quiet -r .github/pr-review/requirements.txt

      - name: Run multi-LLM review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          # 可选：其他 provider key，脚本读到才启用
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python .github/pr-review/review.py
