name: CI Admin

# 区域化 workflow: admin 前端变化时跑 lint/tsc/单测/build; 每周一跑 e2e。
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/**'
  schedule:
    # 每周一 03:00 (UTC) 跑一次 e2e，防止 Playwright 用例静默腐烂
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-admin-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  admin-checks:
    name: Admin — Lint, Test & Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome lint
        run: ./node_modules/.bin/biome check --no-errors-on-unmatched --files-ignore-unknown=true ./

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  admin-e2e:
    # Playwright e2e（登录/找回密码/用户设置是后台最高危路径）。
    # 不阻塞 PR（spec 依赖完整环境），每周定时 + 手动触发跑一次。
    name: Admin E2E (Playwright)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: 准备 .env（含 e2e 需要的 SMTP 指向 mailcatcher）
        working-directory: .
        run: |
          cp .env.example .env
          sed -i 's|^SMTP_HOST=.*|SMTP_HOST=mailcatcher-e2e|' .env
          sed -i 's|^SMTP_PORT=.*|SMTP_PORT=1025|' .env
          sed -i 's|^SMTP_TLS=.*|SMTP_TLS=False|' .env
          # 并行 e2e 用例集中登录/找回密码, 放开 IP 限流阈值
          printf 'LOGIN_IP_MAX=500\nSENSITIVE_MAX=500\n' >> .env

      - name: 启动 db + backend (等健康)
        working-directory: .
        run: docker compose up -d --wait backend

      - name: 启动 mailcatcher（接入 compose 网络，供 backend 发信与用例读信）
        working-directory: .
        run: |
          docker run -d --name mailcatcher-e2e \
            --network "$(docker compose ps -q backend | xargs docker inspect -f '{{range .NetworkSettings.Networks}}{{.NetworkID}}{{end}}')" \
            --network-alias mailcatcher-e2e \
            -p 1080:1080 schickling/mailcatcher

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run e2e
        env:
          MAILCATCHER_HOST: "http://localhost:1080"

      - name: 清理
        if: always()
        working-directory: .
        run: |
          docker rm -f mailcatcher-e2e || true
          docker compose down -v --remove-orphans
