name: CI Backend

# 区域化 workflow (原生路径过滤, 不匹配直接不启动 —— 零 runner 成本):
# 后端代码/构建配置变化时跑 lint、SQLite 测试、PG 测试。
# 注意 concurrency group 带本 workflow 名, 与其它区域 workflow 互不干扰。
on:
  # 不设 push 触发: PR 事件已跑同样检查, main 合并后重复跑纯烧分钟
  # (风险由合并前 update branch 兜底; 详见 docs/07)
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
      - 'deploy.sh'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check app

      - name: Ruff format check
        run: uv run ruff format app --check

      - name: Mypy
        run: uv run mypy app

      # SQLite 套件并行 (bcrypt 等 CPU 密集测试在 4 核 runner 上 ~2 分钟);
      # 覆盖率门槛读 pyproject (fail_under=70)
      - name: Run tests (SQLite, parallel)
        run: uv run pytest -n auto --cov=app --cov-report=term-missing --cov-context=test
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          FIRST_SUPERUSER: "admin@example.com"
          FIRST_SUPERUSER_PASSWORD: "ci-test-password"
          PROJECT_NAME: "qianchenhunlian-ci"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "postgres"
          UPLOAD_DIR: "/tmp/ci-uploads"

  backend-test-pg:
    # 生产是 PostgreSQL，SQLite 单测跑不了 PG 特有行为（_shandong_clause 正则、
    # DELETE...USING 等）。conftest 按 TEST_DATABASE_URL 切引擎, 并行时每个
    # worker 建独立数据库; 含 alembic 迁移链 schema 一致性守门。
    name: Backend — Tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests (PostgreSQL, parallel)
        run: uv run pytest -n auto --cov=app --cov-report=term-missing
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/test"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          FIRST_SUPERUSER: "admin@example.com"
          FIRST_SUPERUSER_PASSWORD: "ci-test-password"
          PROJECT_NAME: "qianchenhunlian-ci"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "postgres"
          UPLOAD_DIR: "/tmp/ci-uploads"
