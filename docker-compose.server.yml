# ============================================================
# 生产部署 override —— 1Panel + OpenResty 服务器
# ------------------------------------------------------------
# 用法（在服务器 /root/qianchenhunlian 下）:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# 与 docker-compose.override.yml(dev) 的区别:
#   - 无外部反代容器；由宿主机 1Panel 的 OpenResty 做反向代理
#     （历史上曾用 docker-compose.traefik.yml + base 里的 traefik labels 方案，已移除）
#   - admin 走生产构建(多阶段 node 编译 -> nginx 托管静态 dist), 不跑 Vite dev server
#   - backend/admin/db 端口只绑 127.0.0.1, 仅本机 OpenResty 可达, 不直接对外
#     OpenResty 反代: api.qianyuan.website     -> 127.0.0.1:8000
#                     dashboard/www.qianyuan.website -> 127.0.0.1:5173
#
# 前置: .env 需设置
#   VITE_API_URL  (现阶段 http://api.qianyuan.website; 配好 HTTPS 证书后改 https)
#   BACKEND_CORS_ORIGINS 需包含 admin 的来源域名
#   以及 DOCKER_IMAGE_BACKEND / DOCKER_IMAGE_FRONTEND / DOMAIN / 各 SECRET 等
# ============================================================
services:

  db:
    restart: always
    ports:
      - "127.0.0.1:5432:5432"      # 仅本机（运维/adminer），不对外

  backend:
    restart: always
    ports:
      - "127.0.0.1:8000:8000"      # OpenResty: api.qianyuan.website -> 8000
    volumes:
      # 用户上传文件 (头像/照片/二维码) 持久化: 此前落在容器可写层, 每次
      # up -d --build 重建容器即被清空 (2026-10-09 走查实锤: 后台传的
      # 红娘二维码被部署冲掉全 404)。命名卷跨容器重建保留, 卷名固定供
      # scripts-server/uploads-backup.sh 引用; 首挂载继承镜像内属主(uid 1000)。
      - "qianyuan-uploads:/app/uploads"

  admin:
    restart: always
    ports:
      - "127.0.0.1:5173:80"        # OpenResty: dashboard/www.qianyuan.website -> 5173

# 卷名固定 (不随 compose 项目前缀漂移), scripts-server/uploads-backup.sh 按名挂载备份
volumes:
  qianyuan-uploads:
    name: qianyuan-uploads
    external: false
