# Dependabot 依赖自动更新配置
# 文档: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# commit-message 统一走 Conventional Commits 的 chore 类型（依赖更新不属于功能修复；
# 安全修复类 PR 以 GitHub 侧 Security Advisory 标题为准，合并时按需手改 fix 前缀）。
version: 2

updates:
  # GitHub Actions workflow 依赖（ci.yml / deploy.yml / pr-review.yml 里的 actions/*）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps-actions)"
      include: scope
    groups:
      actions-minor:
        update-types: ["minor", "patch"]

  # Docker 镜像依赖（各 Dockerfile FROM 与 docker-compose*.yml 的 image）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps-docker)"
      include: scope
    groups:
      docker-minor:
        update-types: ["minor", "patch"]

  # admin 前端 npm 依赖（backend 用 uv 管理，pipa 生态暂不接入）
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps-npm)"
      prefix-development: "chore(deps-npm-dev)"
      include: scope
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
    ignore:
      # 大版本升级按下述原因分两类搁置, 条件成熟后删除对应行恢复升级:
      # 1) peer 依赖冲突 (npm ci ERESOLVE):
      #    - typescript >=6: @hey-api/openapi-ts 要求 typescript ^5
      #    - vite >=8: @tailwindcss/vite 尚未支持 vite 8
      # 2) 破坏性 API 变更, 需专门排期迁移 (升完记得删行):
      #    - @tanstack/react-table >=9: ColumnDef 泛型签名变更, 表格列定义全量改写
      #    - lucide-react >=1: 图标 API 变更, 需全量过一遍图标用法
      - dependency-name: typescript
        versions: ["6.x", "7.x", "8.x"]
      - dependency-name: vite
        versions: ["8.x", "9.x"]
      - dependency-name: "@tanstack/react-table"
        versions: [">=9"]
      - dependency-name: lucide-react
        versions: [">=1"]
