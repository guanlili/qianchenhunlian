name: CI Miniprogram

# 区域化 workflow: 小程序代码/顶层测试变化时跑语法检查与用户旅程模拟。
on:
  push:
    branches: [main]
    paths:
      - 'miniprogram/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'miniprogram/**'
      - 'tests/**'
      - '.github/workflows/**'

concurrency:
  group: ci-miniprogram-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  miniprogram-lint:
    name: Miniprogram Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JS 语法检查 (全量，含顶层测试)
        run: find miniprogram tests -name "*.js" -not -path "*/miniprogram_npm/*" -exec node --check {} \;

  miniprogram-journey:
    # 小程序唯一的全链路回归（登录→资料→会员→兑换→匹配），纯 Node 可跑零依赖
    name: Miniprogram Journey Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 运行用户旅程模拟测试
        run: node tests/miniprogram/journey_test.js
